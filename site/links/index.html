<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CLNJ6PJ3J6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CLNJ6PJ3J6');

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links | Hirayama Seguros</title>
    <meta name="description" content="Acesse os principais links da Hirayama Seguros: seguro de crédito, consultoria RH, seguro saúde, consórcio e redes sociais." />
    <link rel="canonical" href="https://www.segurosdecredito.com.br/links" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="theme-color" content="#05070D" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070d;
        --panel: rgba(255, 255, 255, 0.07);
        --panel-strong: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.72);
        --line: rgba(255, 255, 255, 0.16);
        --blue: #052e5c;
        --blue-soft: #0a4f9a;
        --gold: #f9b912;
        --gold-soft: #ffd86b;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: "Plus Jakarta Sans", "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 50% -12%, rgba(249, 185, 18, 0.18), transparent 28rem),
          linear-gradient(155deg, #05070d 0%, #07162a 52%, #031024 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 22px 14px 30px;
      }

      .phone-shell {
        width: min(100%, 430px);
        min-height: calc(100vh - 52px);
        display: flex;
        flex-direction: column;
      }

      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 18px 10px 22px;
      }

      .avatar {
        width: 104px;
        height: 104px;
        display: grid;
        place-items: center;
        border: 2px solid rgba(249, 185, 18, 0.84);
        border-radius: 999px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.02)),
          linear-gradient(135deg, #052e5c, #0f66ba);
        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.04), var(--shadow);
      }

      .avatar svg {
        width: 54px;
        height: 54px;
      }

      .profile h1 {
        margin: 18px 0 5px;
        font-size: 1.18rem;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .profile p {
        max-width: 28ch;
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .links {
        display: grid;
        gap: 12px;
        width: 100%;
      }

      .link-card {
        min-height: 58px;
        display: grid;
        grid-template-columns: 42px 1fr 24px;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 9px 14px 9px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        color: #06111f;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .link-card:focus-visible {
        outline: 3px solid rgba(249, 185, 18, 0.92);
        outline-offset: 3px;
      }

      .link-card:hover {
        transform: translateY(-2px);
        border-color: rgba(249, 185, 18, 0.82);
        background: #ffffff;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.34);
      }

      .link-card.primary {
        background: linear-gradient(135deg, var(--gold), var(--gold-soft));
        color: #06111f;
        border-color: rgba(255, 255, 255, 0.2);
      }

      .icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #07162a;
        color: #ffffff;
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0;
      }

      .primary .icon {
        background: #06111f;
        color: var(--gold);
      }

      .label {
        min-width: 0;
        font-size: 0.98rem;
        font-weight: 800;
        line-height: 1.15;
        text-align: center;
        letter-spacing: 0;
      }

      .arrow {
        display: grid;
        place-items: center;
        color: rgba(6, 17, 31, 0.62);
      }

      .social-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin: 19px 0 16px;
      }

      .social-row a {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: #ffffff;
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0;
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .social-row a:hover,
      .social-row a:focus-visible {
        transform: translateY(-2px);
        background: var(--panel-strong);
        border-color: rgba(249, 185, 18, 0.78);
        outline: none;
      }

      .footer {
        margin-top: auto;
        padding: 7px 0 0;
        color: rgba(255, 255, 255, 0.58);
        font-size: 0.74rem;
        text-align: center;
      }

      @media (min-width: 768px) {
        .page {
          align-items: center;
          padding: 42px 20px;
        }

        .phone-shell {
          min-height: auto;
          padding: 24px;
          border: 1px solid var(--line);
          border-radius: 34px;
          background: rgba(255, 255, 255, 0.035);
          box-shadow: var(--shadow);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="phone-shell" aria-label="Links da Hirayama Seguros">
        <header class="profile">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 28V21.5C20 14.596 25.596 9 32.5 9C39.404 9 45 14.596 45 21.5V28" stroke="#F9B912" stroke-width="5.5" stroke-linecap="round"/>
              <rect x="14" y="26" width="37" height="29" rx="7" fill="#ffffff"/>
              <path d="M32.5 37V45" stroke="#052E5C" stroke-width="4.5" stroke-linecap="round"/>
              <circle cx="32.5" cy="36" r="4" fill="#052E5C"/>
            </svg>
          </div>
          <h1>Hirayama Seguros</h1>
          <p>Crédito, benefícios, saúde e proteção para empresas.</p>
        </header>

        <nav class="links" aria-label="Links principais">
          <a id="link-seguro-credito" class="link-card primary tracked-link" href="#" data-link-name="Seguro de Crédito" data-analytics="clique_seguro_credito" data-link-type="servico">
            <span class="icon">SC</span>
            <span class="label">Seguro de Crédito</span>
            <span class="arrow" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>

          <a id="link-consultoria-rh" class="link-card tracked-link" href="#" data-link-name="Consultoria RH" data-analytics="clique_consultoria_rh" data-link-type="servico">
            <span class="icon">RH</span>
            <span class="label">Consultoria RH</span>
            <span class="arrow" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>

          <a id="link-seguro-saude" class="link-card tracked-link" href="#" data-link-name="Seguro Saúde" data-analytics="clique_seguro_saude" data-link-type="servico">
            <span class="icon">SS</span>
            <span class="label">Seguro Saúde</span>
            <span class="arrow" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>

          <a id="link-consorcio" class="link-card tracked-link" href="#" data-link-name="Consórcio" data-analytics="clique_consorcio" data-link-type="servico">
            <span class="icon">CO</span>
            <span class="label">Consórcio</span>
            <span class="arrow" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>
        </nav>

        <nav class="social-row" aria-label="Redes sociais">
          <a id="link-linkedin" class="tracked-link social-link" href="#" data-link-name="LinkedIn" data-analytics="clique_linkedin" data-link-type="social" aria-label="LinkedIn">IN</a>
          <a id="link-instagram" class="tracked-link social-link" href="#" data-link-name="Instagram" data-analytics="clique_instagram" data-link-type="social" aria-label="Instagram">IG</a>
          <a id="link-youtube" class="tracked-link social-link" href="#" data-link-name="YouTube" data-analytics="clique_youtube" data-link-type="social" aria-label="YouTube">YT</a>
          <a id="link-tiktok" class="tracked-link social-link" href="#" data-link-name="TikTok" data-analytics="clique_tiktok" data-link-type="social" aria-label="TikTok">TT</a>
          <a id="link-facebook" class="tracked-link social-link" href="#" data-link-name="Facebook" data-analytics="clique_facebook" data-link-type="social" aria-label="Facebook">FB</a>
        </nav>

        <p class="footer">segurosdecredito.com.br</p>
      </section>
    </main>

    <script>
      document.querySelectorAll('.tracked-link[data-analytics]').forEach((link) => {
        link.addEventListener('click', (event) => {
          const label = link.getAttribute('data-link-name') || link.textContent.trim();
          const analyticsEvent = link.getAttribute('data-analytics');
          const linkType = link.getAttribute('data-link-type') || 'link';
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'links_page_click',
            analytics_action: analyticsEvent,
            link_text: label,
            link_type: linkType,
            link_url: link.href,
            page_location: window.location.href
          });

          if (typeof gtag === 'function') {
            gtag('event', 'link_click', {
              event_category: 'links_page',
              event_label: analyticsEvent,
              link_id: link.id,
              link_text: label,
              link_type: linkType,
              page_location: window.location.href,
              transport_type: 'beacon'
            });
          }

          if (link.getAttribute('href') === '#') {
            event.preventDefault();
          }
        });
      });
    </script>
  </body>
</html>
